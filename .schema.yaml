# Yamale schema for this repo's YAML (nac.yaml / sites.yaml).
# Not an ACI schema. Keys are optional so each file can validate on its own:
# sites.yaml only has sites; nac.yaml has lab, ndgs, sites, tacacs, devices.
lab: include('lab', required=False)
ndgs: list(include('ndg'), required=False)
location_ndgs: list(include('location_ndg'), required=False)
sites: list(include('site'), required=False)
tacacs_authc: list(include('tacacs_authc_rule'), required=False)
tacacs_authz: list(include('tacacs_authz_rule'), required=False)
devices: list(include('device'), required=False)
command_sets: list(include('command_set'), required=False)
shell_profiles: list(include('shell_profile'), required=False)
endpoint_identity_groups: list(include('endpoint_identity_group'), required=False)
endpoints: list(include('endpoint'), required=False)
allowed_protocols: list(include('allowed_protocol'), required=False)
authorization_profiles: list(include('authorization_profile'), required=False)
network_access_policy_sets: list(include('network_access_policy_set'), required=False)
network_access_authc: list(include('network_access_authc_rule'), required=False)
network_access_authz: list(include('network_access_authz_rule'), required=False)
---
lab:
  pan: include('pan')

pan:
  count: int()
  hostname: str()
  datastore: str()
  network: str()
  cpu_reservation: bool()
  memory_reservation: bool()
  ova: str()

ndg:
  ndg: str()
  description: str()
  min_tier: enum('T1', 'T2', 'T3', 'T4')

location_ndg:
  ndg: str()
  description: str()
  placeholder: bool()
  parent: str(required=False)

site:
  id: str()
  city: str()
  admin1: str()
  cc: regex('^[a-z]{2}$')
  type: enum('regional', 'branch', 'hq', 'dc')

tacacs_authc_rule:
  order: int()
  name: str()
  protocol: str()
  identity_source: str()
  if_auth_fail: enum('REJECT', 'DROP', 'CONTINUE')
  if_user_not_found: enum('REJECT', 'DROP', 'CONTINUE')
  if_process_fail: enum('REJECT', 'DROP', 'CONTINUE')

tacacs_authz_rule:
  order: int()
  name: str()
  identity_group: str()
  ndg: str()
  command_set: str()
  shell_profile: str()
  time_bound: enum('yes', 'no')

device:
  hostname: str()
  site: str()
  mgmt_ip: str()
  role: enum('sw')
  type: enum('access')

command_set:
  name: str()
  description: str(required=False)
  permit_unmatched: bool(required=False)
  commands: list(include('tacacs_command'), required=False)

tacacs_command:
  command: str()
  arguments: str(required=False)
  grant: enum('PERMIT', 'DENY', 'DENY_ALWAYS', required=False)

shell_profile:
  name: str()
  description: str(required=False)
  priv_lvl: int(required=False)
  session_attributes: list(include('session_attribute'), required=False)

session_attribute:
  type: enum('MANDATORY', 'OPTIONAL')
  name: str()
  value: any(str(), int())

endpoint_identity_group:
  name: str()
  description: str(required=False)
  system_defined: bool(required=False)

# Lab MACs. Fake, locally administered unicast. Not hardware.
endpoint:
  mac: str()
  endpoint_identity_group: str()
  description: str(required=False)

# CiscoDevNet/ise 0.3.4 ise_allowed_protocols required booleans.
allowed_protocol:
  name: str()
  description: str(required=False)
  process_host_lookup: bool()
  allow_pap_ascii: bool()
  allow_chap: bool()
  allow_ms_chap_v1: bool()
  allow_ms_chap_v2: bool()
  allow_eap_md5: bool()
  allow_leap: bool()
  allow_eap_tls: bool()
  allow_eap_ttls: bool()
  allow_eap_fast: bool()
  allow_peap: bool()
  allow_teap: bool()
  allow_preferred_eap_protocol: bool()
  allow_weak_ciphers_for_eap: bool()
  eap_tls_l_bit: bool()
  require_message_auth: bool()
  peap_allow_peap_eap_ms_chap_v2: bool(required=False)
  peap_allow_peap_eap_tls: bool(required=False)
  eap_ttls_pap_ascii: bool(required=False)
  eap_ttls_ms_chap_v2: bool(required=False)
  teap_eap_ms_chap_v2: bool(required=False)
  teap_eap_tls: bool(required=False)

# CiscoDevNet/ise 0.3.4 ise_authorization_profile: access_type, vlan_name_id,
# vlan_tag_id, voice_domain_permission. dacl_name exists but is not used.
authorization_profile:
  name: str()
  description: str(required=False)
  access_type: enum('ACCESS_ACCEPT', 'ACCESS_REJECT')
  vlan_name_id: any(str(), int())
  vlan_tag_id: int()
  voice_domain_permission: bool()

network_access_policy_set:
  name: str()
  description: str(required=False)
  is_proxy: bool()
  rank: int()
  service_name: str()
  state: enum('enabled', 'disabled', 'monitor')
  condition_type: str()
  condition_is_negate: bool()
  condition_dictionary_name: str()
  condition_attribute_name: str()
  condition_operator: str()
  condition_attribute_value: str()

network_access_authc_rule:
  order: int()
  name: str()
  protocol: str()
  identity_source: str()
  if_auth_fail: enum('REJECT', 'DROP', 'CONTINUE')
  if_user_not_found: enum('REJECT', 'DROP', 'CONTINUE')
  if_process_fail: enum('REJECT', 'DROP', 'CONTINUE')
  condition_dictionary_name: str()
  condition_attribute_name: str()
  condition_operator: str()
  condition_attribute_value: str()

network_access_authz_rule:
  order: int()
  name: str()
  endpoint_identity_group: str()
  profile: str()
