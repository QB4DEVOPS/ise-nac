# =============================================================================
# Stellar Express Courier — FULL showcase shell (demo only)
# =============================================================================
# Thin Network-as-Code shell for the made-up overnight courier. GitHub cannot
# host a literal 150k-endpoint YAML, so THIS file keeps policy rich and
# inventories small. Companion samples live under fake_stellar/ as
# stellar_express_*.csv (never production names). Those CSVs are NOT
# consumed by Terraform. Scale counts are not CoS-locked; the generator
# can emit production-ish volumes locally (--full). Do not commit a
# 150k endpoints CSV until CoS confirms.
#
# All 17 .schema.yaml top-level keys are present. Optional fields are
# populated. Cross-refs inside this YAML must resolve for objects that stay
# here; they do not point at fake_stellar/ rows.
#
# Keep fake_ise_system.yaml as the light nine-site demo. This file is the
# buckboard-proud full-system showcase. Do not terraform apply. Do not
# contact a live ISE. Production nac.yaml, TF, generators, CSVs, .rules,
# and the light demo stay untouched.
#
# Safety: no passwords, tokens, keys, or certificates. Management IPs are
# RFC 5737 documentation ranges only (192.0.2.0/24, 198.51.100.0/24,
# 203.0.113.0/24). MACs are synthetic uppercase colon-hex. Emails are
# @example.com only. Rebuild sample CSVs (default) or local full scale:
#   python3 fake_stellar/scripts/generate_stellar_inventory.py
#   python3 fake_stellar/scripts/generate_stellar_inventory.py --full
#
# Cross-references (must resolve inside this file):
#   devices.site -> sites.id
#   tacacs_authz.ndg -> ndgs.ndg
#   tacacs_authz.command_set -> command_sets.name
#   tacacs_authz.shell_profile -> shell_profiles.name
#   users.identity_group -> identity groups used in tacacs_authz
#   endpoints.endpoint_identity_group -> endpoint_identity_groups.name
#   network_access_authz.endpoint_identity_group -> endpoint_identity_groups.name
#   network_access_authz.profile -> authorization_profiles.name
#   network_access_policy_sets.service_name -> allowed_protocols.name
#   location_ndgs.parent -> location_ndgs.ndg (when set)
# =============================================================================

# -----------------------------------------------------------------------------
# lab — single fictional PAN (Policy Administration Node). vSphere fields are
# placeholders for a never-applied lab; no credentials.
# -----------------------------------------------------------------------------
lab:
  pan:
    count: 1
    hostname: stellar-pan1
    datastore: lab-datastore-stellar
    network: lab-mgmt-docnet
    cpu_reservation: false
    memory_reservation: false
    ova: Cisco-vISE-300-3.5.0.527.ova

# -----------------------------------------------------------------------------
# ndgs — four Access Network Device Groups (device-admin scope). min_tier is
# the lowest TACACS identity group that may administer NADs in that NDG.
# Depots = T1+, warehouse = T2+, dispatch = T3+, control tower = T4 only.
# -----------------------------------------------------------------------------
ndgs:
  - ndg: access-depots
    description: Neighborhood depots and retail drop boxes. T1 and above may administer.
    min_tier: T1
  - ndg: access-warehouse
    description: Regional sortation warehouses. T2 and above may administer.
    min_tier: T2
  - ndg: access-dispatch
    description: Fleet dispatch floors. T3 and above may administer.
    min_tier: T3
  - ndg: access-controltower
    description: Global control-tower switches. T4 only.
    min_tier: T4

# -----------------------------------------------------------------------------
# location_ndgs — ISE Location tree. Type-level folders (regional/branch/hq/dc)
# sit under All Locations. State/country folders hold site folders. parent
# points at another location_ndg name when set. hq/dc are real here (Houston
# HQ, Dallas DC). Sample tree is fake_stellar/stellar_express_location_ndgs_sample.csv.
# Production nac.yaml leaves hq/dc as placeholders with no tagged sites.
# -----------------------------------------------------------------------------
location_ndgs:
  - ndg: regional
    description: Largest-city type folder (Pacific / Midwest / Europe hubs).
    placeholder: false
  - ndg: branch
    description: Branch depot type folder.
    placeholder: false
  - ndg: hq
    description: World HQ type folder (Houston control campus).
    placeholder: false
  - ndg: dc
    description: Data-center type folder (Dallas fabric).
    placeholder: false
  - ndg: Texas
    description: US state Texas (HQ + DC).
    placeholder: false
  - ndg: Washington
    description: US state Washington (Pacific regional).
    placeholder: false
  - ndg: Illinois
    description: US state Illinois (Midwest regional).
    placeholder: false
  - ndg: Oregon
    description: US state Oregon (Portland branch).
    placeholder: false
  - ndg: Wisconsin
    description: US state Wisconsin (Milwaukee branch).
    placeholder: false
  - ndg: gb
    description: Country gb (London regional).
    placeholder: false
  - ndg: de
    description: Country de (Berlin branch).
    placeholder: false
  - ndg: jp
    description: Country jp (Tokyo branch).
    placeholder: false
  - ndg: us-houston
    description: Site folder Location#All Locations#Texas#us-houston
    placeholder: false
    parent: Texas
  - ndg: us-dallas
    description: Site folder Location#All Locations#Texas#us-dallas
    placeholder: false
    parent: Texas
  - ndg: us-seattle
    description: Site folder Location#All Locations#Washington#us-seattle
    placeholder: false
    parent: Washington
  - ndg: us-chicago
