# -----------------------------------------------------------------------------
# network_access_policy_sets — live wired set (NAS-Port-Type Ethernet) plus a
# monitor-only MAB specialist so both allowed_protocols names are bound.
# service_name must resolve to allowed_protocols.name in this file.
# -----------------------------------------------------------------------------
network_access_policy_sets:
  - name: Wired 802.1X MAB
    description: Wired 802.1X then MAB for Stellar Express. Not Device Admin. Live first-match set.
    is_proxy: false
    rank: 0
    service_name: Wired_8021X
    state: enabled
    condition_type: ConditionAttributes
    condition_is_negate: false
    condition_dictionary_name: Radius
    condition_attribute_name: NAS-Port-Type
    condition_operator: equals
    condition_attribute_value: Ethernet
  - name: Wired MAB Specialist
    description: Monitor-only MAB specialist list (Wired_MAB). Not the live first-match set.
    is_proxy: false
    rank: 1
    service_name: Wired_MAB
    state: monitor
    condition_type: ConditionAttributes
    condition_is_negate: false
    condition_dictionary_name: Radius
    condition_attribute_name: NAS-Port-Type
    condition_operator: equals
    condition_attribute_value: Ethernet

# -----------------------------------------------------------------------------
# network_access_authc — Dot1X then MAB. MAB continues if the endpoint is
# not yet in Internal Endpoints (same continue-if-not-found as this repo).
# -----------------------------------------------------------------------------
network_access_authc:
  - order: 1
    name: Dot1X
    protocol: 802.1X
    identity_source: ISE Internal Users
    if_auth_fail: REJECT
    if_user_not_found: REJECT
    if_process_fail: DROP
    condition_dictionary_name: Radius
    condition_attribute_name: Service-Type
    condition_operator: equals
    condition_attribute_value: Framed
  - order: 2
    name: MAB
    protocol: MAB
    identity_source: ISE Internal Endpoints
    if_auth_fail: REJECT
    if_user_not_found: CONTINUE
    if_process_fail: DROP
    condition_dictionary_name: Network Access
    condition_attribute_name: UseCase
    condition_operator: equals
    condition_attribute_value: Host Lookup

# -----------------------------------------------------------------------------
# network_access_authz — first-match by endpoint identity group. Phones go
# to voice; printers/AP/cameras/badge/RFID/facilities get their VLANs;
# TVs/Linux/Windows share data VLAN 10. No guest.
# -----------------------------------------------------------------------------
network_access_authz:
  - order: 1
    name: phones
    endpoint_identity_group: Phones
    profile: Wired_Voice
  - order: 2
    name: printers
    endpoint_identity_group: Printers
    profile: Wired_Printer
  - order: 3
    name: ap
    endpoint_identity_group: AP
    profile: Wired_AP
  - order: 4
    name: cameras
    endpoint_identity_group: Cameras
    profile: Wired_Camera
  - order: 5
    name: badge_readers
    endpoint_identity_group: Badge_Readers
    profile: Wired_Badge
  - order: 6
    name: rfid_readers
    endpoint_identity_group: RFID_Readers
    profile: Wired_Badge
  - order: 7
    name: ups
    endpoint_identity_group: UPS
    profile: Wired_Facilities
  - order: 8
    name: powerstrips
    endpoint_identity_group: Powerstrips
    profile: Wired_Facilities
  - order: 9
    name: tvs
    endpoint_identity_group: TVs
    profile: Wired_Data
  - order: 10
    name: linux
    endpoint_identity_group: Linux
    profile: Wired_Data
  - order: 11
    name: windows
    endpoint_identity_group: Windows
    profile: Wired_Data

