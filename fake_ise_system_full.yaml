# -----------------------------------------------------------------------------
# allowed_protocols — wired 802.1X EAP list (also Host Lookup so MAB can
# fire in the same policy set) plus a PAP/ASCII MAB-only list. Bound via
# network_access_policy_sets.service_name.
# -----------------------------------------------------------------------------
allowed_protocols:
  - name: Wired_8021X
    description: Wired 802.1X EAP. Bound to the Network Access policy set. Host Lookup on so MAB can fire.
    process_host_lookup: true
    allow_pap_ascii: false
    allow_chap: false
    allow_ms_chap_v1: false
    allow_ms_chap_v2: false
    allow_eap_md5: false
    allow_leap: false
    allow_eap_tls: true
    allow_eap_ttls: true
    allow_eap_fast: false
    allow_peap: true
    allow_teap: true
    allow_preferred_eap_protocol: false
    allow_weak_ciphers_for_eap: false
    eap_tls_l_bit: false
    require_message_auth: false
    peap_allow_peap_eap_ms_chap_v2: true
    peap_allow_peap_eap_tls: true
    eap_ttls_pap_ascii: true
    eap_ttls_ms_chap_v2: true
    teap_eap_ms_chap_v2: true
    teap_eap_tls: true
  - name: Wired_MAB
    description: Wired MAB. Process Host Lookup and PAP/ASCII only. Bound to the monitor specialist set.
    process_host_lookup: true
    allow_pap_ascii: true
    allow_chap: false
    allow_ms_chap_v1: false
    allow_ms_chap_v2: false
    allow_eap_md5: false
    allow_leap: false
    allow_eap_tls: false
    allow_eap_ttls: false
    allow_eap_fast: false
    allow_peap: false
    allow_teap: false
    allow_preferred_eap_protocol: false
    allow_weak_ciphers_for_eap: false
    eap_tls_l_bit: false
    require_message_auth: false
    peap_allow_peap_eap_ms_chap_v2: false
    peap_allow_peap_eap_tls: false
    eap_ttls_pap_ascii: false
    eap_ttls_ms_chap_v2: false
    teap_eap_ms_chap_v2: false
    teap_eap_tls: false

# -----------------------------------------------------------------------------
