# -----------------------------------------------------------------------------
# command_sets — ISE TACACS command-set POST names (*_cs). IOS first-word
# command + literal arguments (* wildcard only; no PCRE). T4 permits unmatched.
# Vendor/contractor deny reload. Names share an ISE namespace with shell
# profiles, so they must not collide (T1_cs vs T1_shell).
# -----------------------------------------------------------------------------
command_sets:
  - name: T1_cs
    description: Read-only depot ops (show, ping, traceroute). No configure.
    permit_unmatched: false
    commands:
      - grant: PERMIT
        command: show
        arguments: version
      - grant: PERMIT
        command: show
        arguments: ip interface brief
      - grant: PERMIT
        command: show
        arguments: running-config
      - grant: PERMIT
        command: show
        arguments: logging
      - grant: PERMIT
        command: show
        arguments: cdp neighbors
      - grant: PERMIT
        command: ping
        arguments: "*"
      - grant: PERMIT
        command: traceroute
        arguments: "*"
      - grant: DENY
        command: configure
        arguments: "*"
  - name: T2_cs
    description: T1 plus access-port description, shutdown, and access VLAN.
    permit_unmatched: false
    commands:
      - grant: PERMIT
        command: show
        arguments: version
      - grant: PERMIT
        command: show
        arguments: ip interface brief
      - grant: PERMIT
        command: show
        arguments: running-config
      - grant: PERMIT
        command: show
        arguments: logging
      - grant: PERMIT
        command: ping
        arguments: "*"
      - grant: PERMIT
        command: traceroute
        arguments: "*"
      - grant: PERMIT
        command: configure
        arguments: terminal
      - grant: PERMIT
        command: config
        arguments: terminal
      - grant: PERMIT
        command: interface
        arguments: "*"
      - grant: PERMIT
        command: description
        arguments: "*"
      - grant: PERMIT
        command: shutdown
        arguments: ""
      - grant: PERMIT
        command: "no"
        arguments: shutdown
      - grant: PERMIT
        command: switchport
        arguments: "access vlan *"
      - grant: PERMIT
        command: end
        arguments: ""
      - grant: PERMIT
        command: exit
        arguments: ""
      - grant: DENY
        command: reload
        arguments: "*"
  - name: T3_cs
    description: T2 plus VLAN, spanning-tree, and copy run start.
    permit_unmatched: false
    commands:
      - grant: PERMIT
        command: show
        arguments: version
      - grant: PERMIT
        command: show
        arguments: ip interface brief
      - grant: PERMIT
        command: show
        arguments: running-config
      - grant: PERMIT
        command: show
        arguments: logging
      - grant: PERMIT
        command: ping
        arguments: "*"
      - grant: PERMIT
        command: traceroute
        arguments: "*"
      - grant: PERMIT
        command: configure
        arguments: terminal
      - grant: PERMIT
        command: config
        arguments: terminal
      - grant: PERMIT
        command: interface
        arguments: "*"
      - grant: PERMIT
        command: description
        arguments: "*"
      - grant: PERMIT
        command: shutdown
        arguments: ""
      - grant: PERMIT
        command: "no"
        arguments: shutdown
      - grant: PERMIT
        command: "no"
        arguments: "spanning-tree *"
      - grant: PERMIT
        command: "no"
        arguments: "vlan *"
      - grant: PERMIT
        command: switchport
        arguments: "access vlan *"
      - grant: PERMIT
        command: vlan
        arguments: "*"
      - grant: PERMIT
        command: spanning-tree
        arguments: "*"
      - grant: PERMIT
        command: copy
        arguments: running-config startup-config
      - grant: PERMIT
        command: end
        arguments: ""
      - grant: PERMIT
        command: exit
        arguments: ""
      - grant: DENY
        command: reload
        arguments: "*"
  - name: T4_cs
    description: Full device-admin. Unmatched IOS commands permitted (privilege 15).
    permit_unmatched: true
    commands: []
  - name: vendor_cs
    description: Show plus interface description. No shutdown, wr mem, or reload.
    permit_unmatched: false
    commands:
      - grant: PERMIT
        command: show
        arguments: "*"
      - grant: PERMIT
        command: configure
        arguments: terminal
      - grant: PERMIT
        command: config
        arguments: terminal
      - grant: PERMIT
        command: interface
        arguments: "*"
      - grant: PERMIT
        command: description
        arguments: "*"
      - grant: PERMIT
        command: end
        arguments: ""
      - grant: PERMIT
        command: exit
        arguments: ""
      - grant: DENY
        command: reload
        arguments: "*"
      - grant: DENY_ALWAYS
        command: username
        arguments: "*"
  - name: contractor_cs
    description: Same as T2. Access-port work only. No wr mem.
    permit_unmatched: false
    commands:
      - grant: PERMIT
        command: show
        arguments: version
      - grant: PERMIT
        command: show
        arguments: ip interface brief
      - grant: PERMIT
        command: show
        arguments: running-config
      - grant: PERMIT
        command: show
        arguments: logging
      - grant: PERMIT
        command: ping
        arguments: "*"
      - grant: PERMIT
        command: traceroute
        arguments: "*"
      - grant: PERMIT
        command: configure
        arguments: terminal
      - grant: PERMIT
        command: config
        arguments: terminal
      - grant: PERMIT
        command: interface
        arguments: "*"
      - grant: PERMIT
        command: description
        arguments: "*"
      - grant: PERMIT
        command: shutdown
        arguments: ""
      - grant: PERMIT
        command: "no"
        arguments: shutdown
      - grant: PERMIT
        command: switchport
        arguments: "access vlan *"
      - grant: PERMIT
        command: end
        arguments: ""
      - grant: PERMIT
        command: exit
        arguments: ""
      - grant: DENY
        command: reload
        arguments: "*"
  - name: auditor_internal_cs
    description: Internal auditor read-only. show run, version, inventory, logging.
    permit_unmatched: false
    commands:
      - grant: PERMIT
        command: show
        arguments: running-config
      - grant: PERMIT
        command: show
        arguments: version
      - grant: PERMIT
        command: show
        arguments: inventory
      - grant: PERMIT
        command: show
        arguments: logging
  - name: auditor_external_cs
    description: External auditor. show version and inventory only. No show run.
    permit_unmatched: false
    commands:
      - grant: PERMIT
        command: show
        arguments: version
      - grant: PERMIT
        command: show
        arguments: inventory

# -----------------------------------------------------------------------------
# shell_profiles — ISE TACACS profile POST names (*_shell). priv_lvl plus
# session_attributes (MANDATORY priv-lvl). T1 and auditors are privilege 1;
# everyone else is privilege 15.
# -----------------------------------------------------------------------------
shell_profiles:
  - name: T1_shell
    description: Read-only device admin (privilege 1).
    priv_lvl: 1
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "1"
      - type: OPTIONAL
        name: timeout
        value: "15"
  - name: T2_shell
    description: Access-switch interface admin (privilege 15).
    priv_lvl: 15
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "15"
      - type: OPTIONAL
        name: timeout
        value: "30"
  - name: T3_shell
    description: Access-switch VLAN and spanning-tree admin (privilege 15).
    priv_lvl: 15
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "15"
      - type: OPTIONAL
        name: timeout
        value: "30"
  - name: T4_shell
    description: Full device-admin (privilege 15).
    priv_lvl: 15
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "15"
      - type: OPTIONAL
        name: timeout
        value: "60"
  - name: vendor_shell
    description: Vendor interface-description admin (privilege 15).
    priv_lvl: 15
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "15"
      - type: OPTIONAL
        name: timeout
        value: "15"
  - name: contractor_shell
    description: Contractor interface admin, same as T2 (privilege 15).
    priv_lvl: 15
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "15"
      - type: OPTIONAL
        name: timeout
        value: "20"
  - name: auditor_internal_shell
    description: Internal auditor read-only (privilege 1).
    priv_lvl: 1
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "1"
      - type: OPTIONAL
        name: timeout
        value: "15"
  - name: auditor_external_shell
    description: External auditor read-only (privilege 1).
    priv_lvl: 1
    session_attributes:
      - type: MANDATORY
        name: priv-lvl
        value: "1"
      - type: OPTIONAL
        name: timeout
        value: "10"

