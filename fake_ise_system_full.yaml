# -----------------------------------------------------------------------------
# tacacs_authc — Device Admin authentication. One Internal Users rule, same
# shape as tacacs_authc.csv. No AD assumed. Ordered first-match.
# -----------------------------------------------------------------------------
tacacs_authc:
  - order: 1
    name: TACACS Internal Users
    protocol: TACACS
    identity_source: ISE Internal Users
    if_auth_fail: REJECT
    if_user_not_found: REJECT
    if_process_fail: DROP

# -----------------------------------------------------------------------------
# tacacs_authz — Device Admin authorization, first-match (lowest order wins).
# Four staff tiers (T1–T4) plus vendor, contractor, auditor-internal, and
# auditor-external. command_set / shell_profile are the ISE object names in
# this file (T1_cs / T1_shell), not the production CSV keys (T1). Vendors
# and external auditors are time_bound: "yes".
# -----------------------------------------------------------------------------
tacacs_authz:
  - order: 1
    name: auditor-external-access-depots
    identity_group: auditor-external
    ndg: access-depots
    command_set: auditor_external_cs
    shell_profile: auditor_external_shell
    time_bound: "yes"
