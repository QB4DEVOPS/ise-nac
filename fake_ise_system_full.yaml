  - ndg: us-portland-or
    description: Site folder Location#All Locations#Oregon#us-portland-or
    placeholder: false
    parent: Oregon
  - ndg: us-milwaukee
    description: Site folder Location#All Locations#Wisconsin#us-milwaukee
    placeholder: false
    parent: Wisconsin
  - ndg: gb-london
    description: Site folder Location#All Locations#gb#gb-london
    placeholder: false
    parent: gb
  - ndg: de-berlin
    description: Site folder Location#All Locations#de#de-berlin
    placeholder: false
    parent: de
  - ndg: jp-tokyo
    description: Site folder Location#All Locations#jp#jp-tokyo
    placeholder: false
    parent: jp

