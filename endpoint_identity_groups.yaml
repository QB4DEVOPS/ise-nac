# Endpoint identity groups. 11 groups. Guest stays out.
# CiscoDevNet/ise 0.3.4: ise_endpoint_identity_group (name, description, system_defined).
# https://registry.terraform.io/providers/CiscoDevNet/ise/0.3.4/docs/resources/endpoint_identity_group
# Replaces Workstation / IP-Phone / Printer. 10 lab MACs each in endpoints.csv.
# Default endpoint_count=110. Groups-only: TF_VAR_endpoint_count=0.
endpoint_identity_groups:
  - name: Phones
    description: Wired IP phones. Voice VLAN 20. 10 lab MACs.
    system_defined: false
  - name: AP
    description: Access points. VLAN 40. 10 lab MACs.
    system_defined: false
  - name: Printers
    description: Wired MAB printers. VLAN 30. 10 lab MACs.
    system_defined: false
  - name: TVs
    description: Displays. Data VLAN 10. 10 lab MACs.
    system_defined: false
  - name: Badge_Readers
    description: Badge readers. VLAN 60. 10 lab MACs.
    system_defined: false
  - name: Cameras
    description: Cameras. VLAN 50. 10 lab MACs.
    system_defined: false
  - name: UPS
    description: UPS. VLAN 70. 10 lab MACs.
    system_defined: false
  - name: Powerstrips
    description: Power strips. VLAN 70. 10 lab MACs.
    system_defined: false
  - name: Linux
    description: Linux hosts. Data VLAN 10. 10 lab MACs.
    system_defined: false
  - name: Windows
    description: Windows hosts. Data VLAN 10. 10 lab MACs.
    system_defined: false
  - name: RFID_Readers
    description: RFID readers. VLAN 60. 10 lab MACs.
    system_defined: false
