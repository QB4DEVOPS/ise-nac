# CiscoDevNet/ise 0.3.4 ise_endpoint: name, mac, group_id,
# static_group_assignment, static_profile_assignment.
# https://registry.terraform.io/providers/CiscoDevNet/ise/0.3.4/docs/resources/endpoint
