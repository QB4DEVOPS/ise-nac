# Network Access Allowed Protocols. Not TACACS (that is ise_allowed_protocols_tacacs).
# CiscoDevNet/ise 0.3.4: ise_allowed_protocols.
# Schema (required): name, process_host_lookup, allow_pap_ascii, allow_chap,
# allow_ms_chap_v1, allow_ms_chap_v2, allow_eap_md5, allow_leap, allow_eap_tls,
# allow_eap_ttls, allow_eap_fast, allow_peap, allow_teap,
# allow_preferred_eap_protocol, allow_weak_ciphers_for_eap, eap_tls_l_bit,
# require_message_auth.
# https://registry.terraform.io/providers/CiscoDevNet/ise/0.3.4/docs/resources/allowed_protocols
#
# Two lists, one policy set: 0.3.4 ise_network_access_policy_set.service_name
# binds a single Allowed Protocols name. Wired_8021X is that service.
# process_host_lookup is also true on Wired_8021X so the MAB authentication
# rule in the same set can fire. Wired_MAB stays PAP/ASCII + Host Lookup only.
allowed_protocols:
  - name: Wired_8021X
    description: Wired 802.1X EAP. Bound to the Network Access policy set.
    process_host_lookup: true
    allow_pap_ascii: false
    allow_chap: false
    allow_ms_chap_v1: false
    allow_ms_chap_v2: false
    allow_eap_md5: false
    allow_leap: false
    allow_eap_tls: true
    allow_eap_ttls: true
    allow_eap_fast: false
    allow_peap: true
    allow_teap: true
    allow_preferred_eap_protocol: false
    allow_weak_ciphers_for_eap: false
    eap_tls_l_bit: false
    require_message_auth: false
    peap_allow_peap_eap_ms_chap_v2: true
    peap_allow_peap_eap_tls: true
    eap_ttls_pap_ascii: true
    eap_ttls_ms_chap_v2: true
    teap_eap_ms_chap_v2: true
    teap_eap_tls: true
  - name: Wired_MAB
    description: Wired MAB. Process Host Lookup and PAP/ASCII only.
    process_host_lookup: true
    allow_pap_ascii: true
    allow_chap: false
    allow_ms_chap_v1: false
    allow_ms_chap_v2: false
    allow_eap_md5: false
    allow_leap: false
    allow_eap_tls: false
    allow_eap_ttls: false
    allow_eap_fast: false
    allow_peap: false
    allow_teap: false
    allow_preferred_eap_protocol: false
    allow_weak_ciphers_for_eap: false
    eap_tls_l_bit: false
    require_message_auth: false
